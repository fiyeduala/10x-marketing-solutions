# Builds the cPanel release on every push to main and commits it to release/
# on main, which the cPanel server pulls and deploys with .cpanel.yml (see
# cpanel/README.md). release/ is generated: don't edit it by hand.
name: cPanel release

on:
  push:
    branches: [main]
    paths-ignore: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, zip
          tools: composer

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build:cpanel

      - name: Commit the build to release/ on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf release
          mkdir release
          cp -R cpanel-dist/public_html cpanel-dist/csp-app release/
          printf 'Built by .github/workflows/cpanel-release.yml. Edit the source, not this folder.\n' > release/README.txt
          test ! -e release/csp-app/.env
          # -f: some vendor packages ship their own .gitignore files.
          git add -A -f release
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -q -m "Build cPanel release for ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
