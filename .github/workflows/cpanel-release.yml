# Builds the cPanel release on every push to main and commits it to the
# `cpanel-release` branch, which the cPanel server pulls (see cpanel/README.md).
# That branch is generated: don't edit it by hand.
name: cPanel release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, mbstring, zip
          tools: composer

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build:cpanel

      - name: Commit the build to cpanel-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin cpanel-release > /dev/null; then
            git fetch --depth=1 origin cpanel-release
            git worktree add -B cpanel-release release FETCH_HEAD
          else
            git worktree add --orphan -b cpanel-release release
          fi
          find release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R cpanel-dist/public_html cpanel-dist/csp-app release/
          cp cpanel/.cpanel.yml release/
          printf 'Generated by .github/workflows/cpanel-release.yml from main@%s.\nEdit main, not this branch.\n' "$GITHUB_SHA" > release/README.txt
          cd release
          test ! -e csp-app/.env
          # -f: some vendor packages ship their own .gitignore files.
          git add -A -f
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -q -m "Release from main@${GITHUB_SHA::7}"
            git push origin HEAD:cpanel-release
          fi
